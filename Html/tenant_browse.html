<!DOCTYPE html>
<html lang="en-US">

<head>
    <title>Browse Listings</title>
    <link rel="stylesheet" href="../Design/Style.css">
</head>

<body>
    <div class="position">

        <div class="Header">
            <h1>Available Listings</h1>
        </div>

        <div class="topnav">
            <a href="tenant_dashboard.html">Dashboard</a>
            <a href="tenant_browse.html">Browse Listings</a>
            <a href="tenant_bookings.html">My Bookings</a>
            <a href="index.html">Logout</a>
        </div>

    </div>

    <div class="container">

        <h1>Find Your Home</h1>

        <fieldset>
            <legend>Search / Filter Listings</legend>
            <form>
                <table>
                    <tr>
                        <td>
                            <label for="location">Location:</label>
                        </td>

                        <td>
                            <input type="text"id="location" name="location" placeholder="Enter location">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="minRent">Minimum Rent:</label>
                        </td>

                        <td>
                            <input type="number"id="minRent" name="minRent" placeholder="Minimum rent">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="maxRent">Maximum Rent:</label>
                        </td>

                        <td>
                            <input type="number" id="maxRent"name="maxRent" placeholder="Maximum rent">
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label for="propertyType"> Property Type:</label>
                        </td>
                        <td>
                            <select id="propertyType" name="propertyType">
                                <option value=""> Select Property Type </option>
                                <option value="Room"> Room</option>
                                <option value="Flat"> Flat </option>
                                <option value="Apartment">Apartment </option>

                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <label>Gender Preference:</label>
                     </td>
                        <td>
                            <input type="radio"id="male" name="genderPreference" value="Male">
                            <label for="male">Male</label>

                            <br>
                            <input type="radio" id="female" name="genderPreference"value="Female">
                            <label for="female">Female</label>
                            <br>

                            <input type="radio" id="any" name="genderPreference" value="Any">
                            <label for="any">Any</label>
                        </td>
                    </tr>

                    <tr>
                        <td>
                            <label for="furnished">Furnished:</label>
                        </td>
                        <td>
                            <input type="checkbox" id="furnished" name="furnished">
                            <label for="furnished"> Only show furnished properties</label>
                        </td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <input type="submit" value="Search">
                            <input type="reset" value="Clear">
                        </td>
                    </tr>

                </table>

            </form>

        </fieldset>
        <br>
        <fieldset>

            <legend>Available Properties</legend>

            <p>
                No properties are currently available.
            </p>

            <p>
                Please check again later or try different
                search criteria.
            </p>

        </fieldset>

    </div>

    <div class="footer">

        <h2>Created 2026</h2>

    </div>

</body>

</html>
