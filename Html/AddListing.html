<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Listing</title>

    <link rel="stylesheet" href="../Design/Owner.css">

</head>

<body>

  
    <div class="Header">

        <h1>Home Rental Management System</h1>

    </div>

    <div class="topnav">

        <a href="owner_dashboard.html">Dashboard</a>

        <a href="#">Add Listing</a>

        <a href="owner_my_listings.html">My Listings</a>

        <a href="owner_profile.html">My Profile</a>

        <a href="../View/index.html">Logout</a>

    </div>


 
    <div class="container">

        <h2>Add New Property</h2>


       
        <form action="#" method="post" enctype="multipart/form-data">

            <fieldset>

                <legend>Property Information</legend>


                <table>

                 
                    <tr>

                        <td>
                            <label for="property_name">
                                Property Name
                            </label>
                        </td>

                        <td>
                            <input
                                type="text"
                                id="property_name"
                                name="property_name"
                                placeholder="Enter property name"
                                required>
                        </td>

                    </tr>


                   
                    <tr>

                        <td>
                            <label for="location">
                            </label>
                        </td>

                        <td>
                            <input
                                type="text"
                                id="location"
                                name="location"
                                placeholder="Enter location"
                                required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            <label for="rent">
                              
                            </label>
                        </td>

                        <td>
                            <input
                                type="number"
                                id="rent"
                                name="rent"
                                placeholder="Enter monthly rent"
                                min="0"
                                required>
                        </td>

                    </tr>

                    <tr>

                        <td>
                            <label for="bedrooms">
                            
                            </label>
                        </td>

                        <td>
                            <input
                                type="number"
                                id="bedrooms"
                                name="bedrooms"
                                placeholder="Number of bedrooms"
                                min="1"
                                required>
                        </td>

                    </tr>


                    <!-- Bathrooms -->
                    <tr>

                        <td>
                            <label for="bathrooms">
                                Bathrooms
                            </label>
                        </td>

                        <td>
                            <input
                                type="number"
                                id="bathrooms"
                                name="bathrooms"
                                placeholder="Number of bathrooms"
                                min="1"
                                required>
                        </td>

                    </tr>


                    <tr>

                        <td>
                            <label for="property_image">
                              
                            </label>
                        </td>

                        <td>
                            <input
                                type="file"
                                id="property_image"
                                name="property_image"
                                accept="image/*">
                        </td>

                    </tr>


                    
                    <tr>

                        <td>
                            <label for="description">
                                Description
                            </label>
                        </td>

                        <td>

                            <textarea
                                id="description"
                                name="description"
                                rows="5"
                                placeholder="Enter property description"
                                required></textarea>

                        </td>

                    </tr>

                </table>

            </fieldset>



            <input
                type="submit"
                value="Add Listing">

            <input
                type="reset"
                value="Reset">

        </form>

    </div>

</body>

</html>
