<!DOCTYPE html>
<html lang="en-US">

<head>
    <title>Login</title>

    <link rel="stylesheet" href="../Design/Style.css">
    <script src="../JavaScript/Script.js"></script>
</head>

<body>

    <div class="position">

        <div class="Header">
            <h1>Flat Rental Management System</h1>
        </div>

        <div class="topnav">

            <a href="index.html">Home</a>
            <a href="register.html">Register</a>

        </div>

    </div>


    <div class="container">

        <h1>Login</h1>

        <form>

            <table>

                <tr>
                    <td>
                        <label for="username">
                            Username
                        </label>
                    </td>

                    <td>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter Username"
                        >
                    </td>
                </tr>


                <tr>
                    <td>
                        <label for="password">
                            Password
                        </label>
                    </td>

                    <td>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter Password"
                        >
                    </td>
                </tr>

            </table>


            <div class="login-buttons">

                <a href="admin_dashboard.html">
                    <button type="button">
                        Login as Admin
                    </button>
                </a>

                <a href="../Html/Owner.php">
                    <button type="button">
                        Login as Flat Owner
                    </button>
                </a>

                <a href="tenant_dashboard.html">
                    <button type="button">
                        Login as Tenant
                    </button>
                </a>

            </div>

        </form>

    </div>


    <div class="footer">

        <h2>Created 2026</h2>

    </div>

</body>

</html>
